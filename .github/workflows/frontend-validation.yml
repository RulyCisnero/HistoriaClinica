name: Frontend validation

on:
  push:
    branches:
      - feature/demo-frontend
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Format source code
        run: npm run format
      - name: Build frontend
        run: npm run build
